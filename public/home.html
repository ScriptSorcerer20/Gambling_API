<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="styles_home.css">
    <link rel="icon" href="gambling.png" type="image/x-icon">
</head>
<body>
<canvas id="matrix-canvas"></canvas>
<header class="app-header">
    <a class="wordmark" href="/">GAMBLING <span>API</span></a>
    <div class="header-status"><span class="status-dot"></span> TABLE NETWORK ONLINE</div>
    <button class="logout" id="logout">Logout</button>
</header>
<main class="menu-shell">
<aside class="leaderboard">
    <p class="panel-label">Leaderboard</p>
    <h3>HIGH ROLLERS</h3>
    <ul id="leaderboard-list">
        <li>Loading...</li>
    </ul>
    <div id="your-rank" class="your-rank"></div>
</aside>
<section class="command-center">
    <p class="panel-label">Operator console</p>
    <h1><span id="easter-title" spellcheck="false">READY TO DEAL</span><span class="cursor">_</span></h1>
    <div class="balance"><span>AVAILABLE CREDITS</span><strong>$<span id="balance">0</span></strong></div>
    <div class="lobby-buttons">
        <button id="host">Host Lobby</button>
        <button id="join" class="secondary-action">Join Lobby</button>
    </div>
<div id="host-form" class="host-form hidden">
    <div class="lobby-visibility" aria-label="Lobby visibility">
        <label>
            <input type="radio" name="lobby-visibility" value="public" checked/>
            Public Lobby
        </label>
        <label>
            <input type="radio" name="lobby-visibility" value="private"/>
            Private Lobby
        </label>
    </div>
    <button id="create-lobby" type="button">Create Lobby</button>
</div>
<div id="join-form" class="join-browser hidden">
    <div class="join-code-row">
        <label class="sr-only" for="join-code">Lobby code</label>
        <input type="text" id="join-code" placeholder="Enter Lobby ID"/>
        <button id="submit-join">Join</button>
    </div>
    <div class="browser-header">
        <h2>Public Lobbies</h2>
        <button id="refresh-lobbies" type="button">Refresh</button>
    </div>
    <div id="public-lobbies" class="public-lobbies">
        <p>No public lobbies found</p>
    </div>
</div>
<div id="join-error" role="alert" aria-live="polite" class="error-message hidden"></div>
<div id="lobby-room" class="lobby-room hidden">
    <div class="lobby-header">
        <button id="leave-button" class="leave-button">Leave Lobby</button>
    </div>
    <h2>Lobby ID: <span id="lobby-id">N/A</span></h2>
    <div id="player-list">
        <p>Waiting for players...</p>
    </div>
    <button id="start-game" class="start-game hidden" disabled>Start Game</button>
</div>
</section>
</main>
</body>
<script src="protocol.js"></script>
<script src="client.js"></script>
<script src="frontend_home.js" defer></script>
<script src="matrix.js"></script>
</html>
